name: Feature Request
description: Suggest an enhancement for ToolShed
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem are you trying to solve? Is it related to a frustration or missing capability?
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: A clear and concise description of what you would like to see.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative approaches or workarounds you have considered.
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Anything else that helps explain the request.
name: Bug Report
description: File a bug report for ToolShed
title: "[BUG] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the bug.
      placeholder: |
        1. Run `os9 dir test.dsk`
        2. See error
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What you expected to happen instead.
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Linux
        - macOS
        - Windows
  - type: input
    id: version
    attributes:
      label: ToolShed Version
      description: Git commit hash or release version.
      placeholder: "e.g., ba3c372 or v1.2.3"
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Anything else that might help — disk image type, relevant error output, etc.
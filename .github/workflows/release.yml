name: Make Release

on:
  push:
    tags:
      - 'v*'            # Trigger on standard tags like v2.6.1
      - 'V*'            # Trigger on uppercase V tags like V2.6.1
      - '!DiskShed*'    # Explicitly ignore DiskShed tags
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: true

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: .

permissions:
  contents: write

defaults:
  run:
    shell: bash {0}

jobs:
  build:
    if: "!startsWith(github.event.release.tag_name || github.ref_name, 'DiskShed')"
    runs-on: ubuntu-latest

    steps:
      - name: Setup Requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 markdown libfuse-dev

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build Linux & Run Tests
        run: |
          make -C build/unix unixpackage

      - name: Build Windows
        run: |
          make -C build/unix winpackage

      - name: Results
        run: |
          [ -f build/unix/toolshed-*.tgz ] && ls build/unix/toolshed-*.tgz | xargs -I {} bash -c 'echo; md5sum {}; ls -al --color=auto {}; tar tzvf {}'
          [ -f build/unix/toolshed-*.zip ] && ls build/unix/toolshed-*.zip | xargs -I {} bash -c 'echo; md5sum {}; ls -al --color=auto {}; unzip -l -v {}'

      - name: Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          generate_release_notes: true
          files: |
            doc/changelog.md
            build/unix/toolshed-*.tgz
            build/unix/toolshed-*.zip

  macos:
    name: macOS (${{ matrix.arch }})
    if: "!startsWith(github.event.release.tag_name || github.ref_name, 'DiskShed')"
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}

    permissions:
      contents: write

    steps:
      - name: Setup Requirements
        run: |
          brew install markdown

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build macOS & Run Tests
        run: |
          set -e
          make -C build/unix NO_COCOFUSE=1 MAKEPACKAGE="zip -9" \
            'PACKAGENAME=toolshed-macos-${{ matrix.arch }}-$(VERSION).zip' unixpackage

      - name: Results
        run: |
          set -e
          for f in build/unix/toolshed-macos-*.zip; do
            echo; shasum -a 256 "$f"; ls -al "$f"; unzip -l -v "$f"
            unzip -p "$f" 'toolshed-*/os9' > os9-check
            test "$(lipo -archs os9-check)" = "${{ matrix.arch }}"
          done

      - name: Attach macOS Package to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          files: build/unix/toolshed-macos-*.zip
